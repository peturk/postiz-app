<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400..900&display=swap">
<style>
  html, body { margin: 0; background: #111418; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #E6E9EC; font-family: "Source Sans 3", system-ui, sans-serif; }
  #stage.feed { height: 1350px; }
  .layer { position: absolute; inset: 0; }
  .cast { position: absolute; }
  .cast svg { width: 100%; height: auto; display: block; }
  .clock { position: absolute; left: 80px; top: 150px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; font-size: 150px; letter-spacing: -4px; line-height: 1; font-variant-numeric: tabular-nums; }
  .kicker { position: absolute; left: 84px; top: 110px; font-weight: 700; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; }
  .cap { position: absolute; left: 80px; right: 80px; top: 340px; font-weight: 780; font-size: 86px; line-height: 1.02; letter-spacing: -2.4px; text-wrap: balance; }
  .tape { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(to bottom, transparent 38%, #C5CBD2 38%, #C5CBD2 62%, transparent 62%), #FF5A1F; }
  .card { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 18px 40px -20px rgba(17,20,24,.5); padding: 30px 34px; font-weight: 700; }
  .end { position: absolute; inset: 0; z-index: 20; background: #111418; color: #EEF0F2; display: grid; place-items: center; }
  .end .inner { display: grid; justify-items: center; gap: 44px; }
  .end .mark { display: flex; align-items: center; gap: 30px; }
  .end .mark img { width: 150px; height: 150px; border-radius: 34px; }
  .end .mark span { font-weight: 700; font-size: 104px; letter-spacing: -2px; }
  .end .line { font-weight: 760; font-size: 64px; letter-spacing: -1.6px; line-height: 1.08; text-align: center; max-width: 860px; }
  .end .url { font-weight: 600; font-size: 40px; color: #97A1AC; }
</style>
<div id="stage"></div>
<script>
  /* Deterministic randomness: every render of a video is identical. */
  (function () {
    var seed = 20260924;
    Math.random = function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })();
</script>
<script src="cast.js"></script>
<script src="cards.js"></script>
<script>
(function () {
  "use strict";
  var C = window.SporbokCast;
  C.manual(true);
  var ICON = "__ICON__";
  var stage = document.getElementById("stage");
  var params = new URLSearchParams(location.search);
  var FEED = params.get("fmt") === "feed";
  if (FEED) stage.classList.add("feed");
  var H = FEED ? 1350 : 1920;
  var FLOOR = FEED ? 1090 : 1340; /* y of the floor line; v2 films lower it with big() */
  var K = FEED ? 0.82 : 1.2; /* cast scale for the format */

  /* ---------------- timeline ---------------- */
  var events = [], tweens = [], ticks = [];
  function at(t, fn) { events.push({ t: t, fn: fn, done: false }); }
  function tween(t0, t1, fn, ease) { tweens.push({ t0: t0, t1: t1, fn: fn, ease: ease || smooth }); }
  function every(fn) { ticks.push(fn); }
  function smooth(p) { return p * p * (3 - 2 * p); }
  function out(p) { return 1 - Math.pow(1 - p, 3); }
  function lerp(a, b, p) { return a + (b - a) * p; }
  function mix(c1, c2, p) {
    var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    var r = Math.round(lerp(a >> 16, b >> 16, p)), g = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, p)), bl = Math.round(lerp(a & 255, b & 255, p));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }

  function el(html, cls) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.innerHTML = html || "";
    stage.appendChild(d);
    return d;
  }
  /* A cast member standing with its feet on y=floorY, centred on x, w wide. */
  function cast(kind, x, w, opts) {
    w = w * K;
    var host = el("", "cast");
    host.style.width = w + "px";
    var h = w * 1.25;
    function place(cx, fy, rot) {
      host.style.left = (cx - w / 2) + "px";
      host.style.top = (fy - h * 0.97) + "px";
      host.style.transform = rot ? "rotate(" + rot + "deg)" : "";
      host.style.transformOrigin = "50% 100%";
    }
    place(x, opts && opts.floor != null ? opts.floor : FLOOR);
    var handle = C.mount(host, kind, Object.assign({ live: true }, opts || {}));
    handle.host = host; handle.place = place;
    window.__cast = window.__cast || {};
    if (!window.__cast[kind]) window.__cast[kind] = handle;
    return handle;
  }
  function caption(t0, t1, text, style) {
    var d = el(text, "cap");
    if (style) Object.assign(d.style, style);
    d.style.opacity = 0;
    tween(t0, t0 + 0.35, function (p) { d.style.opacity = p; d.style.transform = "translateY(" + (1 - p) * 24 + "px)"; }, out);
    if (t1 != null) tween(t1 - 0.3, t1, function (p) { d.style.opacity = 1 - p; });
    return d;
  }
  function endCard(t0) {
    var d = el('<div class="inner" style="opacity:0"><div class="mark"><img src="' + ICON + '" alt=""><span>Sporbók</span></div>'
      + '<div class="line">Þú vinnur verkið.<br>Sporbók man söguna.</div><div class="url">sporbok.is</div></div><div class="tape"></div>', "end");
    d.style.opacity = 0;
    var inner = d.querySelector(".inner");
    tween(t0, t0 + 0.4, function (p) { d.style.opacity = p; });
    tween(t0 + 0.4, t0 + 0.75, function (p) { inner.style.opacity = p; inner.style.transform = "translateY(" + (1 - p) * 16 + "px)"; }, out);
    return d;
  }
  function background(color) {
    var bg = el("", "layer"); bg.style.background = color;
    return bg;
  }
  function floor(color) {
    var f = el("", "layer");
    f.style.top = FLOOR + "px"; f.style.background = color;
    return f;
  }
  /* A low, flat Reykjavík skyline: pitched roofs, no landmarks. */
  function skyline(color, y) {
    var svg = '<svg viewBox="0 0 1080 260" width="1080" height="260" style="position:absolute;left:0;top:' + (y - 260) + 'px"><g fill="' + color + '">'
      + '<rect x="0" y="150" width="210" height="110"/><path d="M0 150 L105 92 L210 150Z"/>'
      + '<rect x="250" y="120" width="170" height="140"/><path d="M250 120 L335 70 L420 120Z"/>'
      + '<rect x="470" y="170" width="240" height="90"/>'
      + '<rect x="760" y="130" width="150" height="130"/><path d="M760 130 L835 84 L910 130Z"/>'
      + '<rect x="930" y="160" width="150" height="100"/><path d="M930 160 L1005 118 L1080 160Z"/>'
      + '</g></svg>';
    return el(svg, "layer");
  }
  /* Sky bodies carry their own light: a crescent cut with an SVG mask (never a
     shadow painted in the sky colour, which dissolved the moon into the night)
     and a soft halo, so they read on any sky. Both return { el, set(p) } where
     p = 0..1 is how far along its arc the body is. */
  var skyId = 0;
  function moon(x, y, r) {
    var id = "mn" + (++skyId);
    var d = el('<svg viewBox="-2 -2 4 4" width="' + 6 * r + '" height="' + 6 * r + '" style="position:absolute;left:' + (x - 3 * r) + 'px;top:' + (y - 3 * r) + 'px;overflow:visible">'
      + '<defs><radialGradient id="' + id + 'g"><stop offset="0" stop-color="#EEF3F8" stop-opacity=".35"/><stop offset="1" stop-color="#EEF3F8" stop-opacity="0"/></radialGradient>'
      + '<mask id="' + id + 'm"><rect x="-2" y="-2" width="4" height="4" fill="#fff"/><circle cx=".42" cy="-.26" r=".86" fill="#000"/></mask></defs>'
      + '<circle r="1.9" fill="url(#' + id + 'g)"/>'
      + '<circle r=".62" fill="#F2F5F8" mask="url(#' + id + 'm)"/></svg>', "layer");
    d.style.opacity = 0;
    return d;
  }
  function sun(x, y, r) {
    var id = "sn" + (++skyId);
    var d = el('<svg viewBox="-2 -2 4 4" width="' + 6 * r + '" height="' + 6 * r + '" style="position:absolute;left:' + (x - 3 * r) + 'px;top:' + (y - 3 * r) + 'px;overflow:visible">'
      + '<defs><radialGradient id="' + id + 'g"><stop offset="0" stop-color="#FFD58A" stop-opacity=".45"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/></radialGradient></defs>'
      + '<circle r="1.9" fill="url(#' + id + 'g)"/><circle r=".62" fill="#FFC45C"/></svg>', "layer");
    return d;
  }

  /* Rain: seeded streaks on a canvas, advanced by the timeline clock. */
  function rain(density, color, alpha) {
    var cv = document.createElement("canvas"); cv.width = 1080; cv.height = H; cv.className = "layer";
    stage.appendChild(cv);
    var ctx = cv.getContext("2d"), drops = [];
    for (var i = 0; i < density; i++) drops.push({ x: Math.random() * 1200, y: Math.random() * H, v: 1500 + Math.random() * 900, l: 26 + Math.random() * 30 });
    var state = { alpha: alpha };
    every(function (t, dt) {
      ctx.clearRect(0, 0, 1080, H);
      ctx.strokeStyle = color; ctx.globalAlpha = state.alpha; ctx.lineWidth = 4; ctx.lineCap = "round";
      ctx.beginPath();
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i]; d.y += d.v * dt; d.x -= d.v * dt * 0.18;
        if (d.y > H) { d.y -= H + 60; d.x = Math.random() * 1200; }
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.18, d.y - d.l);
      }
      ctx.stroke();
    });
    return state;
  }

  var CARD_NOTAN = window.SB_CARDS.notan, cardTvo = window.SB_CARDS.tvo;

  /* ---------------- the videos ---------------- */
  var VIDEOS = {};

  /* 1. 17:00. Friday dusk: the day ends, and so does Sporbók. */
  VIDEOS.fimm = function () {
    var bg = background("#E6E9EC");
    var sky = skyline("#D5DAE0", FLOOR);
    var mn = moon(900, FEED ? 170 : 240, 46, "#E6E9EC", "#1A2027");
    var fl = floor("#CFD5DB");
    var kick = el("Föstudagur", "kicker"); kick.style.color = "#B63A0B";
    var clock = el("16:58", "clock"); clock.style.color = "#111418";
    /* Films pin explicit moods, never a random pool: every exported keyframe
       is a pose that was chosen and checked. */
    var van = cast("van", 290, 440, { mood: "content", look: { x: 0.4, y: -0.1 } });
    var hat = cast("hat", 660, 200, { mood: "content", look: { x: -0.4, y: -0.1 } });
    var box = cast("box", 900, 240, { mood: "content", look: { x: -0.2, y: -0.1 } });
    var c0 = caption(0.4, 4.2, "Eitt enn."); c0.style.color = "#111418";
    at(1.6, function () { clock.textContent = "16:59"; });
    at(3.2, function () { clock.textContent = "17:00"; hat.look(0.1, -0.05); van.look(0.3, 0); box.look(-0.3, -0.1); box.setMood("relieved"); });
    /* Drowsy eyes look ahead, never sideways or down: a side glance reads
       skeptical, and looking down closes a heavy lid into a sliver. */
    at(4.4, function () { van.setMood("calm"); van.look(0, 0); hat.setMood("drowsy"); hat.look(0, 0); });
    /* The goodnight, tight: the lid snaps, the hat, then the van's lamps. */
    at(4.2, function () { box.setMood("asleep"); });
    /* Settled beats, so every keyframe lands on a finished pose, never a blend:
       4.4-5.0 hat drowsy, van calm; 5.0-5.6 hat asleep, van drowsy; 5.6 on all asleep. */
    at(5.0, function () { hat.setMood("asleep"); van.setMood("drowsy"); });
    at(5.6, function () { van.setMood("asleep"); });
    tween(4.2, 6.6, function (p) {
      bg.style.background = mix("#E6E9EC", "#1A2027", p);
      fl.style.background = mix("#CFD5DB", "#252C35", p);
      sky.querySelector("g").setAttribute("fill", mix("#D5DAE0", "#20272F", p));
      clock.style.color = mix("#111418", "#EEF0F2", p);
      mn.style.opacity = p * 0.9;
      stage.style.setProperty("--cast-shadow", p > 0.5 ? "rgba(255,255,255,.07)" : "#C9CFD6");
    });
    var c1 = caption(5.6, 9.2, "Sporbók slekkur á sér."); c1.style.color = "#EEF0F2";
    endCard(9.2);
    return 12.7;
  };

  /* 2. Nótan: a receipt that nearly got lost finds its job. */
  VIDEOS.notan = function () {
    var bg = background("#1C232B");
    var fl = floor("#151A20");
    var kick = el("Í bílnum · 07:52", "kicker"); kick.style.color = "#FF9A6B"; kick.style.zIndex = 8;
    /* The underside of the van's seat, filling the top of the frame. */
    /* High enough that her eyes show just under its edge: the worry has to read. */
    var SEAT = 1150;
    var seat = el('<svg viewBox="0 0 1080 1160" width="1080" height="1160"><rect x="-40" y="0" width="1160" height="760" rx="90" fill="#2A3440"/><rect x="60" y="700" width="960" height="70" rx="35" fill="#222B35"/><rect x="180" y="760" width="40" height="' + (SEAT - 760) + '" rx="12" fill="#11161B"/><rect x="860" y="760" width="40" height="' + (SEAT - 760) + '" rx="12" fill="#11161B"/></svg>', "layer");
    seat.style.top = (FLOOR - SEAT) + "px"; seat.style.zIndex = 6;
    var c1 = caption(0.3, 3.0, "Undir sætinu aftur."); c1.style.color = "#EEF0F2"; c1.style.zIndex = 8;
    /* Wedged: bigger than the gap, so the seat edge covers her top. */
    var note = cast("note", 520, 330, { mood: "oops", look: { x: 0.3, y: -0.2 } });
    note.host.style.zIndex = 5;
    stage.style.setProperty("--cast-shadow", "rgba(255,255,255,.05)");
    note.play("wiggle");
    at(1.3, function () { note.play("wiggle"); });
    at(2.3, function () { note.setMood("surprised"); });
    /* The seat lifts away and the day comes in: she is found. */
    tween(2.6, 3.4, function (p) {
      seat.style.top = lerp(FLOOR - SEAT, -1300, p) + "px";
      bg.style.background = mix("#1C232B", "#E6E9EC", p);
      fl.style.background = mix("#151A20", "#CFD5DB", p);
      kick.style.color = mix("#FF9A6B", "#B63A0B", p);
      stage.style.setProperty("--cast-shadow", p > 0.5 ? "#C9CFD6" : "rgba(255,255,255,.05)");
    });
    tween(2.9, 3.4, function (p) { note.place(lerp(520, 300, p), FLOOR, 0); });
    at(3.4, function () { kick.textContent = "Hafnarstræti 12 · 07:58"; });
    var card = el(CARD_NOTAN, "card");
    card.style.width = "440px"; card.style.top = (FLOOR - 470) + "px"; card.style.left = "1180px";
    tween(3.3, 4.0, function (p) { card.style.left = lerp(1180, 580, p) + "px"; }, out);
    at(3.6, function () { note.setMood("curious"); note.look(0.8, 0); });
    /* She crosses and steps up onto the card: a slide, then the one joy beat. */
    tween(4.2, 5.4, function (p) {
      note.place(lerp(300, 800, p), FLOOR - 462 * Math.min(1, p * 1.25), lerp(0, 3, p));
    }, smooth);
    at(5.5, function () { note.setMood("joy"); note.look(0, 0); card.querySelector(".bar").style.background = "#FF5A1F"; });
    at(6.6, function () { note.setMood("content"); });
    caption(5.6, 8.8, "Komin á rétt verk.").style.color = "#111418";
    endCard(8.9);
    return 12.4;
  };

  /* 3. 07:40. A dark, cold morning; nobody clocked in. */
  VIDEOS.morgunn = function () {
    var bg = background("#141B26");
    var sky = skyline("#1B2531", FLOOR);
    var mn = moon(860, FEED ? 170 : 250, 40, "#DDE3E9", "#141B26"); mn.style.opacity = 0.9;
    var fl = floor("#26303C");
    var frost = el("", "layer"); frost.style.cssText += "top:" + FLOOR + "px;height:10px;bottom:auto;background:#DDE6EE;opacity:.6";
    var clock = el("07:39", "clock"); clock.style.color = "#EEF0F2";
    var van = cast("van", 360, 460, { mood: "asleep" });
    var hat = cast("hat", 850, 210, { mood: "asleep" });
    stage.style.setProperty("--cast-shadow", "rgba(255,255,255,.06)");
    at(1.0, function () { van.setMood("sleepy"); });
    at(1.3, function () { clock.textContent = "07:40"; });
    at(1.6, function () { van.setMood("alert"); });
    at(2.0, function () { hat.setMood("sleepy"); });
    at(2.3, function () { hat.setMood("curious"); hat.look(-0.6, 0); });
    at(2.6, function () { van.setMood("neutral"); van.play("nod"); van.look(0.1, -0.05); });
    at(3.4, function () { hat.setMood("content"); hat.play("nod"); });
    tween(1.5, 4.5, function (p) {
      bg.style.background = mix("#141B26", "#3E5566", p);
      fl.style.background = mix("#26303C", "#5E6E7B", p);
      sky.querySelector("g").setAttribute("fill", mix("#1B2531", "#4A6072", p));
      mn.style.opacity = 0.9 * (1 - p);
    });
    caption(2.2, 7.2, "Á staðnum.").style.color = "#EEF0F2";
    endCard(7.2);
    return 10.7;
  };

  /* 4. Sunnudagskvöld. The kitchen table, before and after. */
  VIDEOS.sunnudagur = function () {
    var bg = background("#2A2521");
    var lamp = el("", "layer"); lamp.style.background = "radial-gradient(circle at 50% 30%, rgba(255,214,150,.22), transparent 60%)";
    var table = el("", "layer"); table.style.cssText += "top:" + FLOOR + "px;background:#6E4B33";
    var edge = el("", "layer"); edge.style.cssText += "top:" + FLOOR + "px;height:18px;bottom:auto;background:#825A3E";
    var kick = el("Sunnudagur · 22:14", "kicker"); kick.style.color = "#FF9A6B";
    var c1 = caption(0.4, 4.6, "Sunnudagskvöld."); c1.style.color = "#F3EDE6";
    var cup = el('<svg viewBox="0 0 120 120" width="150" height="150"><rect x="14" y="26" width="76" height="84" rx="14" fill="#E6E9EC"/><rect x="82" y="44" width="30" height="40" rx="15" fill="none" stroke="#E6E9EC" stroke-width="10"/><rect x="24" y="36" width="56" height="10" rx="5" fill="#6E4B33"/></svg>', "cast");
    cup.style.left = "840px"; cup.style.top = (FLOOR - 142) + "px";
    /* The pile is tired, not frantic: it is the evening that is the problem. */
    var pile = [];
    [[150, 210, -7, "thinking"], [345, 225, 4, "neutral"], [535, 205, -3, "calm"], [720, 220, 6, "thinking"]].forEach(function (p, i) {
      var n = cast("note", p[0], p[1], { mood: p[3], look: { x: (i % 3 - 1) * 0.5, y: 0.2 } });
      n.place(p[0], FLOOR, p[2]);
      pile.push(n);
    });
    at(2.2, function () { pile[1].setMood("oops"); });
    /* A short hi-vis wipe, then the same table. */
    var wipe = el("", "layer"); wipe.style.cssText += "left:-1200px;width:1200px;right:auto;background:linear-gradient(to right, transparent 0, transparent 40px, #FF5A1F 40px, #FF5A1F 120px, #C5CBD2 120px, #C5CBD2 150px, #FF5A1F 150px, #FF5A1F 230px, #2A2521 230px)";
    tween(4.7, 5.2, function (p) { wipe.style.left = lerp(-1200, 1080, p) + "px"; }, smooth);
    at(4.95, function () {
      pile.forEach(function (n, i) { if (i) n.host.style.display = "none"; });
      pile[0].place(440, FLOOR, -4); pile[0].setMood("relieved");
    });
    var c2 = caption(5.4, 9.0, "Reikningurinn er tilbúinn."); c2.style.color = "#F3EDE6";
    at(6.2, function () { pile[0].setMood("content"); });
    endCard(9.0);
    return 12.5;
  };

  /* 5. Tvö verk. One receipt, two jobs; it lands on the right one. */
  VIDEOS.tvo = function () {
    background("#E6E9EC");
    floor("#CFD5DB");
    var kick = el("Byggingavöruverslunin · 12:10", "kicker"); kick.style.color = "#B63A0B";
    caption(0.3, 4.2, "Tvö verk. Ein nóta.").style.color = "#111418";
    function jobCard(x, title, sub) {
      var c = el(cardTvo(title, sub), "card");
      c.style.width = "330px"; c.style.left = x + "px"; c.style.top = (FLOOR - 470) + "px";
      return c;
    }
    var left = jobCard(16, "Hafnarstræti 12", "Pípulögn · bað");
    var right = jobCard(666, "Laugavegur 88", "Pípulögn · eldhús");
    var note = cast("note", 540, 240, { mood: "thinking", look: { x: -0.8, y: 0 } });
    note.host.style.zIndex = 5;
    at(1.4, function () { note.look(0.8, 0); });
    at(2.5, function () { note.look(-0.8, 0); note.setMood("curious"); });
    at(3.4, function () { note.play("jolt"); note.setMood("alert"); });
    /* A slide up onto the card, not a hop. */
    tween(3.9, 4.9, function (p) {
      note.place(lerp(540, 215, p), FLOOR - 462 * Math.min(1, p * 1.3), lerp(0, -4, p));
    }, smooth);
    at(5.0, function () { note.setMood("relieved"); note.play("nod"); left.querySelector(".bar").style.background = "#FF5A1F"; });
    caption(5.2, 8.2, "Rétt verk. Sjálfkrafa.").style.color = "#111418";
    endCard(8.2);
    return 11.7;
  };

  /* Clean mode: keyframes for image-to-video carry no text at all. The edit
     adds captions, the clock and the end card, so no model ever draws a letter. */
  if (params.get("clean") === "1") {
    var st = document.createElement("style");
    st.textContent = ".cap,.kicker,.clock,.end{display:none!important}.card .t{visibility:hidden!important}";
    document.head.appendChild(st);
  }

  /* ================= v2: feature films =================
     Scenes only. Every word, chip, pin and number is drawn by overlay.html on
     top of the generated picture. Keyframes are exported at shot boundaries
     (0, 3.5, 7, 10.5, 14, 17, 20 s): three 7 s shots per film. */

  /* A job site: a small two-storey house with scaffolding. No signs. */
  function jobHouse(x, w) {
    var h = w * 0.95;
    var d = el('<svg viewBox="0 0 400 380" width="' + w + '" height="' + h + '" style="position:absolute;left:' + x + 'px;top:' + (FLOOR - h) + 'px">'
      + '<rect x="40" y="130" width="300" height="250" fill="#C9B79C"/>'
      + '<path d="M20 140 L190 30 L360 140 Z" fill="#6E4B3A"/>'
      + '<rect x="80" y="180" width="60" height="60" fill="#2C5F7F"/><rect x="230" y="180" width="60" height="60" fill="#2C5F7F"/>'
      + '<rect x="160" y="280" width="60" height="100" fill="#5A3E2E"/>'
      + '<rect x="330" y="110" width="10" height="270" fill="#8A96A3"/><rect x="390" y="110" width="10" height="270" fill="#8A96A3"/>'
      + '<rect x="330" y="170" width="70" height="8" fill="#8A96A3"/><rect x="330" y="260" width="70" height="8" fill="#8A96A3"/>'
      + '</svg>', "layer");
    return d;
  }
  /* A builders' merchant: a long low shed with an orange awning. No lettering. */
  function store(x, w) {
    var h = w * 0.6;
    return el('<svg viewBox="0 0 500 300" width="' + w + '" height="' + h + '" style="position:absolute;left:' + x + 'px;top:' + (FLOOR - h) + 'px">'
      + '<rect x="0" y="60" width="500" height="240" fill="#B8C0C8"/>'
      + '<rect x="0" y="40" width="500" height="30" fill="#8A96A3"/>'
      + '<rect x="30" y="100" width="440" height="36" fill="#FF5A1F"/><rect x="30" y="112" width="440" height="8" fill="#C5CBD2"/>'
      + '<rect x="190" y="170" width="120" height="130" fill="#2C5F7F"/><rect x="249" y="170" width="3" height="130" fill="#1B3A4E"/>'
      + '<rect x="40" y="170" width="110" height="70" fill="#DDE3E9"/><rect x="350" y="170" width="110" height="70" fill="#DDE3E9"/>'
      + '</svg>', "layer");
  }
  /* Home at night: a small house with one warm window. */
  function home(x, w) {
    var h = w * 0.9;
    return el('<svg viewBox="0 0 300 270" width="' + w + '" height="' + h + '" style="position:absolute;left:' + x + 'px;top:' + (FLOOR - h) + 'px">'
      + '<rect x="30" y="100" width="240" height="170" fill="#3A4452"/>'
      + '<path d="M10 110 L150 20 L290 110 Z" fill="#2A3038"/>'
      /* The lit window sits on the right: whoever stands in front of the home
         stands at its left, and a hidden window left a dark block. */
      + '<rect x="70" y="190" width="50" height="80" fill="#252C35"/>'
      + '<rect class="win" x="170" y="140" width="64" height="56" fill="#FFD58A"/>'
      + '</svg>', "layer");
  }
  function road(color, y, h) {
    var r = el("", "layer"); r.style.cssText += "top:" + y + "px;height:" + h + "px;bottom:auto;background:" + color;
    return r;
  }
  function skyTween(bg, t0, t1, a, b) { tween(t0, t1, function (p) { bg.style.background = mix(a, b, p); }); }

  /* v2 framing: a lower horizon and a bigger cast, so the characters fill the
     frame; the upper third is left for the app UI drawn by overlay.html. */
  function big() { FLOOR = 1580; K = 1.75; }

  /* A. Mætt: dawn arrival at the site, the day recorded. */
  VIDEOS.maett = function () {
    big();
    var bg = background("#1E2A38");
    var sn = sun(900, 430, 56);
    sn.style.opacity = 0;
    var house = jobHouse(600, 480);
    var fl = floor("#8C969F");
    road("#6B747D", FLOOR + 50, 110);
    var hat = cast("hat", 680, 140, { mood: "neutral", look: { x: -0.5, y: 0 } });
    var box = cast("box", 948, 150, { mood: "neutral", look: { x: -0.5, y: 0 } });
    var van = cast("van", -300, 330, { mood: "content", look: { x: 0.8, y: 0 } });
    skyTween(bg, 0, 7, "#1E2A38", "#9DB6CB");
    tween(0, 7, function (p) { fl.style.background = mix("#4E5760", "#A6AFB7", p); });
    tween(0.5, 7, function (p) { sn.style.opacity = Math.min(1, p * 2); sn.style.transform = "translateY(" + (1 - p) * 560 + "px)"; }, out);
    tween(0.3, 5.6, function (p) { van.place(lerp(-300, 300, p), FLOOR); }, out);
    at(5.6, function () { van.setMood("glad"); van.look(0.3, 0); hat.setMood("glad"); hat.look(-0.5, 0); box.setMood("glad"); box.look(-0.5, 0); });
    at(8.0, function () { van.setMood("neutral"); van.look(0.2, -0.05); hat.setMood("glad"); hat.look(0.3, 0.15); box.setMood("glad"); box.look(-0.3, 0.15); });
    skyTween(bg, 14, 20, "#9DB6CB", "#A9C3D6");
    tween(7, 20, function (p) { sn.style.transform = "translateY(" + (-p * 40) + "px)"; });
    at(13.2, function () { hat.setMood("proud"); hat.look(0, -0.05); box.setMood("glad"); box.look(0, -0.05); van.setMood("glad"); van.look(0.2, -0.05); });
    return 20;
  };

  /* B. Nótan: a stop at the merchant, the receipt read and put on the job. */
  VIDEOS.nota = function () {
    big();
    background("#A9C3D6");
    var sn = sun(900, 620, 50);
    var st = store(380, 700);
    floor("#A6AFB7");
    road("#6B747D", FLOOR + 50, 110);
    var van = cast("van", 305, 330, { mood: "neutral", look: { x: 0.45, y: 0 } });
    /* The receipt is already out on the pavement: characters never pop in. */
    var note = cast("note", 720, 150, { mood: "curious", look: { x: -0.6, y: 0 } });
    at(4.3, function () { note.setMood("curious"); note.look(0.8, -0.3); });
    at(8.0, function () { note.setMood("alert"); note.look(0.6, -0.4); });
    at(9.8, function () { note.setMood("glad"); note.look(0.2, -0.1); van.setMood("glad"); van.look(0.4, 0); });
    at(13.2, function () { note.look(0, -0.1); });
    at(16.2, function () { note.look(-0.3, -0.05); van.look(0.2, -0.05); });
    return 20;
  };

  /* C. Drögin: work done, the invoice draft assembles itself. */
  VIDEOS.drog = function () {
    big();
    background("#C9D8E4");
    var sn = sun(880, 560, 50);
    jobHouse(620, 460);
    floor("#A6AFB7");
    var box = cast("box", 220, 190, { mood: "neutral", look: { x: 0.3, y: 0 } });
    var hat = cast("hat", 480, 140, { mood: "content", look: { x: -0.4, y: 0.1 } });
    var note = cast("note", 700, 125, { mood: "neutral", look: { x: -0.5, y: 0 } });
    at(0.8, function () { box.setMood("neutral"); box.look(0.3, -0.2); });
    at(2.8, function () { box.setMood("curious"); box.look(0.4, -0.5); });
    at(2.8, function () { hat.setMood("curious"); hat.look(0.2, -0.5); note.setMood("curious"); note.look(0, -0.5); });
    at(8.0, function () { hat.setMood("happy"); note.setMood("glad"); box.setMood("glad"); box.look(0.3, -0.1); });
    at(13.2, function () { hat.setMood("proud"); hat.look(0, -0.1); note.look(0, -0.1); box.look(0, -0.1); });
    return 20;
  };

  /* D. Frítíminn er þinn: the shift ends by hand, evening at home. */
  VIDEOS.fri2 = function () {
    big();
    var bg = background("#E8B98C");
    var sn = sun(820, 900, 70);
    var mn = moon(840, 520, 56);
    var house = jobHouse(600, 460);
    var hm = home(620, 420); hm.style.opacity = 0;
    /* The ground is drawn after the sun, so the sun really sets behind it. */
    var fl = floor("#9A8F88");
    var van = cast("van", 305, 330, { mood: "content", look: { x: 0.3, y: 0 } });
    var hat = cast("hat", 740, 140, { mood: "content", look: { x: -0.5, y: 0 } });
    tween(0, 7, function (p) { sn.style.transform = "translateY(" + p * 700 + "px)"; });
    skyTween(bg, 0, 7, "#E8B98C", "#4A4F6A");
    tween(0, 7, function (p) { fl.style.background = mix("#9A8F88", "#3F434F", p); });
    at(2.8, function () { hat.setMood("content"); hat.look(0.3, 0.1); van.setMood("content"); van.look(0.2, 0); });
    /* Hard cut to home at a shot boundary: a generated dissolve became a double
       exposure with a house that popped out. The moon rises and stays. */
    at(7.0, function () { house.style.opacity = 0; hm.style.opacity = 1; });
    skyTween(bg, 7, 12, "#4A4F6A", "#141B26");
    tween(7, 12, function (p) { fl.style.background = mix("#3F434F", "#20262F", p); });
    tween(7.5, 11, function (p) { mn.style.opacity = p; mn.style.transform = "translateY(" + (1 - p) * 90 + "px)"; });
    stage.style.setProperty("--cast-shadow", "rgba(255,255,255,.06)");
    /* Content on the way home, then asleep: no half-closed stage in between. */
    at(9.8, function () { van.setMood("content"); van.look(0.1, 0); hat.setMood("content"); hat.look(-0.2, 0); });
    at(12.6, function () { van.setMood("asleep"); hat.setMood("asleep"); });
    return 20;
  };

  /* ---------------- driver ---------------- */
  var name = params.get("v") || "fimm";
  var duration = VIDEOS[name]();
  window.__duration = duration;
  var lastT = 0;
  window.__frame = function (t) {
    var dt = t - lastT; lastT = t;
    for (var i = 0; i < events.length; i++) if (!events[i].done && t >= events[i].t) { events[i].done = true; events[i].fn(); }
    /* A tween writes while it runs and once more at its end, then stops; a
       finished tween that kept writing its end value overrode later ones. */
    for (var j = 0; j < tweens.length; j++) {
      var w = tweens[j];
      if (w.done || t < w.t0) continue;
      var pp = Math.min(1, (t - w.t0) / Math.max(1e-6, w.t1 - w.t0));
      w.fn(w.ease(pp));
      if (pp >= 1) w.done = true;
    }
    for (var k = 0; k < ticks.length; k++) ticks[k](t, dt);
    C.step(dt > 0 ? dt : 1 / 30);
  };
})();
</script>
