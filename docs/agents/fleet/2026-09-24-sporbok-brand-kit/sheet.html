<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#E6E9EC;font:13px system-ui;padding:16px}
.row{display:grid;grid-template-columns:110px repeat(9,1fr);gap:8px;align-items:center;margin-bottom:8px}
.cell{background:#EEF0F2;aspect-ratio:240/300;display:grid;place-items:center}
.cell.ink{background:#111418}
.cell svg{width:88%}
.sil svg *{fill:#111418!important;stroke:#111418!important}
.sil .sb-eye{display:none}
h4{margin:0}
</style>
<div id="g"></div>
<script src="cast.js"></script>
<script>
var C=SporbokCast, g=document.getElementById("g");
var hdr=document.createElement("div");hdr.className="row";hdr.innerHTML="<b></b>"+["idle","avakt","skrad","bidur","hissa","ahyggjur","fri"].map(b=>"<b>"+b+"</b>").join("")+"<b>on ink</b><b>silhouette</b>";g.appendChild(hdr);
C.KINDS.forEach(function(k){
  var r=document.createElement("div");r.className="row";r.innerHTML="<h4>"+C.ART[k].name+"</h4>";g.appendChild(r);
  ["idle","avakt","skrad","bidur","hissa","ahyggjur","fri"].forEach(function(b){var c=document.createElement("div");c.className="cell";r.appendChild(c);C.mount(c,k,{mood:C.BEHAVIOURS[b].moods[0],live:false});});
  var c=document.createElement("div");c.className="cell ink";r.appendChild(c);C.mount(c,k,{mood:"neutral",live:false});
  var c2=document.createElement("div");c2.className="cell sil";r.appendChild(c2);C.mount(c2,k,{mood:"neutral",live:false});
});
</script>
